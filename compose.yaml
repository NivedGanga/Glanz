services:
  db:
    image: postgres:16
    env_file: .env.docker.local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - glanz_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glanz -d glanz"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  glanz_db:
