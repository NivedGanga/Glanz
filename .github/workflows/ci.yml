name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm test
        env:
          RUN_DB_TESTS: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
